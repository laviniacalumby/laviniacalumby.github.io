<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise Library — Lavinia Calumby</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--dark:#1c1a17;--dark2:#2a2722;--accent:#8a7150;--accent-light:#c9b48e;--off-white:#f4f1eb;--warm-gray:#e8e2d8;--mid-gray:#a89e8e;--text:#4a453d;--white:#faf9f7;--font-d:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif}
    body{background:var(--off-white);color:var(--dark);font-family:var(--font-b);font-weight:300;min-height:100vh}
    header{background:var(--dark);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
    header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 60% 0%,rgba(138,113,80,.15) 0%,transparent 70%);pointer-events:none}
    .logo{font-family:var(--font-d);font-size:1rem;color:var(--accent-light);letter-spacing:.15em;margin-bottom:.75rem;font-style:italic}
    header h1{font-family:var(--font-d);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:300;color:var(--white);line-height:1.15}
    header h1 em{font-style:italic;color:var(--accent-light)}
    header p{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mid-gray);margin-top:.75rem}
    .search-wrap{background:var(--dark2);padding:1.25rem 1.25rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(138,113,80,.2)}
    .search-inner{max-width:900px;margin:0 auto;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    .search-box{flex:1;min-width:200px;display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(201,180,142,.25);padding:.65rem 1rem;gap:.6rem}
    .search-box input{background:none;border:none;outline:none;color:var(--white);font-family:var(--font-b);font-size:.9rem;font-weight:300;width:100%}
    .search-box input::placeholder{color:rgba(255,255,255,.3)}
    .filters{display:flex;gap:.4rem;flex-wrap:wrap}
    .filter-btn{font-family:var(--font-b);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .85rem;border:1px solid rgba(201,180,142,.3);background:none;color:var(--mid-gray);cursor:pointer;transition:all .2s;white-space:nowrap}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
    .container{max-width:1100px;margin:0 auto;padding:2rem 1.25rem 4rem}
    .results-count{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mid-gray);margin-bottom:1.25rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .card{background:var(--white);border:1px solid var(--warm-gray);cursor:pointer;transition:all .25s}
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(28,26,23,.12);border-color:var(--accent-light)}
    .card-visual{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
    .card-visual svg{width:90px;height:90px;opacity:.85}
    .card-tag{position:absolute;top:8px;left:8px;font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;padding:.25rem .55rem;background:rgba(138,113,80,.85);color:var(--white)}
    .card-body{padding:1.1rem}
    .card-name{font-family:var(--font-d);font-size:1.2rem;font-weight:400;color:var(--dark);margin-bottom:.25rem}
    .card-muscle{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
    .card-equip{font-size:.72rem;color:var(--mid-gray);margin-bottom:.5rem}
    .card-footer{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.1rem;border-top:1px solid var(--warm-gray)}
    .card-level{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mid-gray)}
    .overlay{position:fixed;inset:0;background:rgba(28,26,23,.88);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .overlay.open{display:flex}
    .modal{background:var(--white);width:100%;max-width:660px;max-height:93vh;overflow-y:auto;position:relative;animation:slideUp .3s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-visual{height:200px;display:flex;align-items:center;justify-content:center;position:relative}
    .modal-visual svg{width:120px;height:120px;opacity:.9}
    .modal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.12);border:none;color:var(--white);width:34px;height:34px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .modal-body{padding:1.5rem 1.5rem 2.5rem}
    .modal-tag{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem}
    .modal-name{font-family:var(--font-d);font-size:1.9rem;font-weight:300;color:var(--dark);line-height:1.15;margin-bottom:.2rem}
    .modal-muscle{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid-gray);margin-bottom:.3rem}
    .modal-equip{font-size:.78rem;color:var(--mid-gray);margin-bottom:1.25rem;font-style:italic}
    .section-label{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.55rem;margin-top:1.3rem;padding-bottom:.3rem;border-bottom:1px solid var(--warm-gray)}
    .steps{list-style:none}
    .steps li{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--off-white);font-size:.88rem;color:var(--text);line-height:1.6;align-items:flex-start}
    .steps li:last-child{border-bottom:none}
    .step-num{font-family:var(--font-d);font-size:1rem;color:var(--accent-light);flex-shrink:0;width:18px}
    .cues{display:flex;flex-direction:column;gap:.45rem}
    .cue{background:var(--off-white);padding:.7rem 1rem;font-size:.86rem;color:var(--text);line-height:1.6;border-left:2px solid var(--accent-light)}
    .breath-box{background:var(--dark);padding:1.1rem 1.25rem}
    .breath-box p{font-size:.86rem;color:rgba(255,255,255,.78);line-height:1.7}
    .pf-box{background:var(--off-white);border:1px solid var(--warm-gray);padding:1.1rem 1.25rem}
    .pf-box p{font-size:.86rem;color:var(--text);line-height:1.7}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--mid-gray);grid-column:1/-1}
    @media(min-width:640px){.overlay{align-items:center}}
  </style>
</head>
<body>
<header>
  <div class="logo">Lavinia Calumby</div>
  <h1>Exercise <em>Library</em></h1>
  <p>Movement &middot; Technique &middot; Breathing &middot; Core &amp; Pelvic Floor</p>
</header>
<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by exercise name or muscle..." autocomplete="off" />
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="glutes">Glutes</button>
      <button class="filter-btn" data-filter="legs">Legs</button>
      <button class="filter-btn" data-filter="core">Core</button>
      <button class="filter-btn" data-filter="arms">Arms</button>
      <button class="filter-btn" data-filter="upper">Upper Body</button>
      <button class="filter-btn" data-filter="calves">Calves</button>
      <button class="filter-btn" data-filter="full">Full Body</button>
    </div>
  </div>
</div>
<div class="container">
  <div class="results-count" id="resultsCount"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-visual" id="modalVisual">
      <button class="modal-close" id="modalClose">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="modal-tag" id="modalTag"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-muscle" id="modalMuscle"></div>
      <div class="modal-equip" id="modalEquip"></div>
      <div class="section-label">HOW TO PERFORM</div>
      <ul class="steps" id="modalSteps"></ul>
      <div class="section-label">COACHING CUES</div>
      <div class="cues" id="modalCues"></div>
      <div class="section-label">BREATHING TECHNIQUE</div>
      <div class="breath-box" id="modalBreath"></div>
      <div class="section-label">CORE ACTIVATION &amp; PELVIC FLOOR</div>
      <div class="pf-box" id="modalPF"></div>
    </div>
  </div>
</div>

d\"/><path d=\"M68 54 L92 44\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"28\" cy=\"42\" r=\"4\" fill=\"#8a7150\" opacity=\"0.5\"/><circle cx=\"92\" cy=\"42\" r=\"4\" fill=\"#8a7150\" opacity=\"0.5\"/></svg>", "upper": "<svg viewBox=\"0 0 120 120\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"22\" r=\"10\" fill=\"#c9b48e\" opacity=\"0.9\"/><path d=\"M60 32 L60 60\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M60 60 L44 78 L42 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M60 60 L76 78 L78 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M52 40 L24 50\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M68 40 L96 50\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"16\" y=\"46\" width=\"10\" height=\"8\" rx=\"2\" fill=\"#8a7150\" opacity=\"0.6\"/><rect x=\"94\" y=\"46\" width=\"10\" height=\"8\" rx=\"2\" fill=\"#8a7150\" opacity=\"0.6\"/></svg>", "arms": "<svg viewBox=\"0 0 120 120\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"55\" cy=\"20\" r=\"10\" fill=\"#c9b48e\" opacity=\"0.9\"/><path d=\"M55 30 L55 58\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M55 58 L42 78 L42 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M55 58 L68 78 L68 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M48 40 L22 52 Q12 60 20 74\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"10\" y=\"70\" width=\"12\" height=\"8\" rx=\"2\" fill=\"#8a7150\" opacity=\"0.6\"/><path d=\"M62 40 L75 44\" stroke=\"#c9b48e\" stroke-width=\"2.5\" stroke-linecap=\"round\"/></svg>", "calves": "<svg viewBox=\"0 0 120 120\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"18\" r=\"9\" fill=\"#c9b48e\" opacity=\"0.9\"/><path d=\"M60 27 L60 52\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M50 36 L35 42\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M70 36 L85 42\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M60 52 L46 72 L44 88 L48 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M60 52 L74 72 L76 88 L72 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M44 88 L50 95 L58 100\" stroke=\"#c9b48e\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/><path d=\"M76 88 L70 95 L62 100\" stroke=\"#c9b48e\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\"0.6\"/></svg>", "full": "<svg viewBox=\"0 0 120 120\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"60\" cy=\"18\" r=\"10\" fill=\"#c9b48e\" opacity=\"0.9\"/><path d=\"M60 28 L60 55\" stroke=\"#c9b48e\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><path d=\"M60 55 L40 75 L38 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M60 55 L80 75 L82 100\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M50 36 L25 28\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M70 36 L95 28\" stroke=\"#c9b48e\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"25\" cy=\"26\" r=\"5\" fill=\"#8a7150\" opacity=\"0.6\"/><circle cx=\"95\" cy=\"26\" r=\"5\" fill=\"#8a7150\" opacity=\"0.6\"/></svg>"};
const bgColors = {"glutes": "linear-gradient(135deg,#2d2218 0%,#1c1a17 100%)", "legs": "linear-gradient(135deg,#1e2218 0%,#1c1a17 100%)", "core": "linear-gradient(135deg,#18202d 0%,#1c1a17 100%)", "upper": "linear-gradient(135deg,#1a2224 0%,#1c1a17 100%)", "arms": "linear-gradient(135deg,#22182d 0%,#1c1a17 100%)", "calves": "linear-gradient(135deg,#1a2420 0%,#1c1a17 100%)", "full": "linear-gradient(135deg,#241a1a 0%,#1c1a17 100%)"};
const exercises = [{"id": "hipthrust", "name": "Hip Thrust", "category": "glutes", "muscle": "Gluteus Maximus", "level": "Beginner–Advanced", "equipment": "Bench · Barbell or Dumbbell", "steps": ["Sit on the floor with upper back against a bench, feet flat hip-width apart.", "Place a barbell or dumbbell across your hips and hold steady.", "Brace your core, press through your heels, drive your hips up to a straight line from knees to shoulders.", "Squeeze your glutes hard at the top for 1–2 seconds.", "Lower slowly back toward the floor with full control."], "cues": ["Drive through your HEELS — wiggling toes at the top means you're doing it right", "Chin slightly tucked — avoid hyperextending the neck at the top", "Knees stay at 90° at the top — do not let them cave inward", "Squeeze HARD at the top — the contraction is the entire point of this exercise"], "breath": "Inhale at the bottom. Exhale powerfully as you drive your hips up. Never hold your breath or bear down hard into the floor.", "pf": "As you exhale and drive up, your pelvic floor naturally lifts with the breath. Think of gently 'zipping up' from the pelvic floor as you push your hips up. If you feel downward pressure or heaviness, reduce load and focus on breath connection first."}, {"id": "gluebridge", "name": "Glute Bridge", "category": "glutes", "muscle": "Gluteus Maximus, Hamstrings", "level": "Beginner", "equipment": "Bodyweight or Dumbbell", "steps": ["Lie on your back, knees bent, feet flat hip-width apart, arms at sides.", "Press your lower back gently into the floor and take a breath in.", "Exhale and press through your heels to lift hips off the floor.", "Hold at the top, squeeze glutes, body forms a straight line from knees to shoulders.", "Lower slowly back to the floor with control."], "cues": ["Drive through HEELS — if you feel it in your quads, move feet further away", "Squeeze at the TOP and hold 2 seconds — feel the glute contraction fully", "Do not arch the lower back at the top — keep a neutral spine", "Control the descent — 2–3 seconds lowering down"], "breath": "Inhale at the bottom. Exhale as you press hips up. The exhale naturally activates the deep core and pelvic floor together — perfect coordination.", "pf": "One of the best exercises for pelvic floor rehabilitation. As you exhale and lift, your pelvic floor lifts with the breath. You can add a gentle conscious pelvic floor engagement on the exhale. Safe for postpartum and all pelvic floor conditions."}, {"id": "singlegbridge", "name": "Single Leg Glute Bridge", "category": "glutes", "muscle": "Gluteus Maximus, Core, Hip Stabilizers", "level": "Intermediate", "equipment": "Bodyweight", "steps": ["Lie on your back, knees bent, feet flat. Extend one leg straight with toes pointed up.", "Press the lower back into the floor and brace your core.", "Exhale and drive through the grounded heel to lift your hips.", "Keep your hips level — the extended leg side must not drop.", "Lower with control and complete all reps before switching sides."], "cues": ["HIPS STAY LEVEL — do not let one side drop down", "Drive through the HEEL of the bent leg — not the toe", "The extended leg works too — keep it active and long", "This is harder than it looks — reduce range of motion before adding height"], "breath": "Inhale at the bottom. Exhale as you drive the hips up. The unilateral demand means your core has to work much harder to stabilize.", "pf": "Single leg bridges significantly challenge pelvic stability. Watch for the pelvis dropping on the unsupported side — this indicates gluteus medius weakness. Exhale on the drive up and feel the pelvic floor lift. Excellent progression from the standard glute bridge."}, {"id": "cablekickback", "name": "Cable Kickback", "category": "glutes", "muscle": "Gluteus Maximus", "level": "Beginner", "equipment": "Cable Machine or Resistance Band", "steps": ["Attach a cuff to your ankle and connect to a low cable pulley. Face the machine and hold it lightly for balance.", "Stand tall, slight forward hinge from the hips, core braced.", "Keeping the leg straight, drive it back and up behind you squeezing the glute at the top.", "Hold the peak contraction for 1 second.", "Return the leg slowly to the start position without letting the weight stack touch down."], "cues": ["Squeeze the GLUTE at the top — you should feel it almost cramping if intensity is right", "Do not swing or use momentum — slow and controlled wins here", "Slight hinge forward from hips — this puts the glute in a better mechanical position", "Keep the working leg mostly straight — a slight bend is fine but not a bent knee kickback"], "breath": "Exhale as you kick back and squeeze. Inhale as you return forward. Keep your core braced the whole time.", "pf": "Low pelvic floor risk. Maintain core brace throughout and breathe with every rep. This is a great isolation exercise for building the gluteus maximus without loading the spine."}, {"id": "donkeykick", "name": "Donkey Kick", "category": "glutes", "muscle": "Gluteus Maximus", "level": "Beginner", "equipment": "Bodyweight or Ankle Weight", "steps": ["Start on all fours, hands under shoulders, knees under hips, neutral spine.", "Keeping your knee bent at 90°, drive one foot up toward the ceiling.", "Drive up until your thigh is parallel to the floor or as high as comfortable without arching the lower back.", "Hold at the top and squeeze the glute for 1 second.", "Lower the knee back down without touching the floor and repeat."], "cues": ["Do NOT arch your lower back to get more height — the movement comes from the hip not the spine", "Keep the knee at 90° throughout — a bent knee isolates the glute better", "SQUEEZE at the top — that contraction is what builds the muscle", "Hips stay square to the floor — no rotation of the pelvis"], "breath": "Exhale as you drive the foot up. Inhale as you lower back down. Keep breathing rhythmically throughout.", "pf": "The quadruped position reduces gravity load on the pelvic floor making this ideal for all levels including early postpartum. Focus on the glute contracting — not the lower back. Keep hips level and breathe with every rep."}, {"id": "clamshell", "name": "Clamshell", "category": "glutes", "muscle": "Gluteus Medius", "level": "Beginner", "equipment": "Bodyweight or Resistance Band", "steps": ["Lie on your side, hips stacked, knees bent at 90°, feet together. Band just above knees if using.", "Rest head on lower arm. Top hand on hip to ensure pelvis stays still.", "Keeping feet together, rotate your top knee open toward the ceiling as far as possible without the pelvis rolling back.", "Hold at the top 1 second and squeeze the outer glute.", "Lower slowly. Complete all reps then switch sides."], "cues": ["The PELVIS must not move — your hip is the axis, not the pelvis", "Think of a clamshell opening — foot stays still, knee lifts", "Squeeze at the TOP — if you feel it in the outer glute and hip you are doing it correctly", "Go SLOW — if you are rushing you are compensating with other muscles"], "breath": "Exhale as you open the knee to the ceiling. Inhale as you lower back down. Natural breathing is fine for this activation exercise.", "pf": "The clamshell directly activates the gluteus medius which is a key pelvic stabilizer. Strengthening it protects the pelvic floor indirectly during all dynamic movement. Foundational for pelvic health and safe for all levels including postpartum."}, {"id": "lateralwalk", "name": "Lateral Band Walk", "category": "glutes", "muscle": "Gluteus Medius, Gluteus Minimus", "level": "Beginner", "equipment": "Resistance Band", "steps": ["Place band just above knees. Stand in a slight squat, feet hip-width apart.", "Take a controlled step to the right with the right foot, maintaining band tension.", "Follow with the left foot — feet stay at least hip-width apart throughout.", "Continue 10–12 steps one direction then reverse.", "Stay in the slight squat throughout — do not stand up between steps."], "cues": ["Stay LOW — standing up reduces glute activation dramatically", "CONTROL each step — no snapping the band. Slow and deliberate.", "Maintain tension in the band throughout — feet never come all the way together", "Toes facing forward — resist turning the feet outward"], "breath": "Exhale on each step outward. Keep your core gently braced the entire time. Natural rhythmic breathing throughout.", "pf": "Builds pelvic stability from the outside in. A strong gluteus medius reduces stress on the pelvic floor during all dynamic movement. Keep pelvis level with each step — no waddling or dropping on one side."}, {"id": "seateddabduction", "name": "Seated Hip Abduction", "category": "glutes", "muscle": "Gluteus Medius, Gluteus Minimus, TFL", "level": "Beginner", "equipment": "Machine or Band", "steps": ["Sit upright in the machine or on a bench with a band just above your knees.", "Feet flat on the floor, posture tall, core gently engaged.", "Press your knees outward against the resistance as wide as comfortable.", "Hold the wide position for 1 second squeezing the outer hips.", "Bring the knees back together slowly with control."], "cues": ["Sit TALL — do not slouch or lean back into the movement", "The squeeze comes from the OUTER HIP — not the quads or hip flexors", "Control the return — do not let the knees snap back together", "Drive through the full range — as wide as you can without losing posture"], "breath": "Exhale as you press the knees apart. Inhale as you bring them back together. Core stays gently braced throughout.", "pf": "A very safe exercise for the pelvic floor due to the seated position. The outer hip muscles trained here are important pelvic stabilizers. Recommended for beginners and postpartum clients as a starting point for glute medius work."}, {"id": "curtsy", "name": "Curtsy Lunge", "category": "glutes", "muscle": "Gluteus Medius, Gluteus Maximus, Quadriceps", "level": "Intermediate", "equipment": "Bodyweight or Dumbbell", "steps": ["Stand with feet hip-width apart, dumbbells optional at your sides.", "Step your right foot back and to the LEFT, crossing behind the left leg.", "Lower your back knee toward the floor, keeping your front knee over your ankle.", "Push through your front heel to return to standing.", "Complete all reps on one side then switch."], "cues": ["Front knee stays pointing forward — do not let it cave inward", "The crossing behind motion targets the gluteus medius specifically — make it deliberate", "Torso stays upright — do not lean forward or to the side", "Drive through the FRONT heel to stand up"], "breath": "Inhale as you step back and lower. Exhale as you drive through the front heel to stand.", "pf": "The rotational element challenges pelvic stability uniquely. Keep your pelvis level and neutral — no excessive rotation. Exhale on the drive up and let the pelvic floor lift with the breath. Intermediate clients only."}, {"id": "rdl", "name": "Romanian Deadlift", "category": "glutes", "muscle": "Hamstrings, Gluteus Maximus", "level": "Beginner–Advanced", "equipment": "Barbell or Dumbbells", "steps": ["Stand tall, feet hip-width apart, weights in front of thighs.", "Maintain a soft bend in the knees throughout.", "Push your hips BACK as you hinge forward — weights travel close down your legs.", "Lower until you feel a deep hamstring stretch — usually mid-shin.", "Drive hips forward to stand. Squeeze glutes at the top."], "cues": ["Push hips BACK like touching the wall behind you — hip hinge not a squat", "Weights stay CLOSE to your legs the entire way — no gap", "Flat back throughout — if lower back rounds you have gone too deep", "Feel the STRETCH in the back of the legs — that is the hamstrings loading correctly"], "breath": "Inhale as you hinge forward and lower. Exhale as you drive hips forward and stand. The exhale powers the standing phase.", "pf": "As you hinge, your pelvic floor gently lengthens — this is normal and healthy. On the way up as you exhale, feel the pelvic floor gently lift. Never bear down or push outward. If you feel heaviness or pressure, reduce load and reconnect with breath."}, {"id": "singlelegrdl", "name": "Single Leg Romanian Deadlift", "category": "glutes", "muscle": "Hamstrings, Gluteus Maximus, Hip Stabilizers", "level": "Intermediate–Advanced", "equipment": "Dumbbell or Kettlebell", "steps": ["Stand on one foot with a soft bend in the standing knee. Hold a weight in the opposite hand.", "Hinge forward from the hip, extending the free leg straight back as your torso lowers.", "Lower until your body forms a T shape — torso and back leg parallel to the floor.", "Drive through the standing heel and squeeze the glute to return upright.", "Complete all reps then switch sides."], "cues": ["Think of your body as a SEESAW — chest goes down, leg goes up equally", "Keep the hips SQUARE to the floor — do not let the free hip rotate open", "Standing leg has a soft bend — not locked and not squatting", "The weight goes straight down under your shoulder — not swinging away from you"], "breath": "Inhale as you hinge forward and lower. Exhale as you drive back up to standing. The single leg demand means your core must work much harder.", "pf": "Significant pelvic stability challenge. Watch for pelvis dropping or rotating on the free leg side — this indicates hip stabilizer weakness. Exhale on the drive up. Master the bilateral RDL before attempting this variation."}, {"id": "squat", "name": "Goblet Squat", "category": "legs", "muscle": "Quadriceps, Glutes, Core", "level": "Beginner", "equipment": "Dumbbell or Kettlebell", "steps": ["Hold a dumbbell at chest height with both hands. Feet slightly wider than hip-width, toes turned out slightly.", "Inhale, brace your core, begin sitting DOWN and BACK as if onto a chair behind you.", "Lower until thighs are parallel to the floor or as deep as comfortable with a tall spine.", "Press through the whole foot to drive back up to standing.", "Squeeze glutes briefly at the top before the next rep."], "cues": ["Chest UP — the weight at chest height naturally helps keep you upright", "Knees track over your toes — push knees out in line with your second toe", "Weight through the WHOLE foot — heel, ball and toes all grounded equally", "Sit BACK and DOWN — think of finding a chair behind you"], "breath": "Inhale at the top before descending — this creates spinal pressure for protection. Exhale as you press up out of the squat. Never hold your breath at the bottom.", "pf": "As you descend, your pelvic floor naturally lowers with the breath — allow this. As you exhale and stand, the pelvic floor gently lifts. Do not grip or clench. Let the breath guide the pelvic floor naturally with each rep."}, {"id": "backsquat", "name": "Barbell Back Squat", "category": "legs", "muscle": "Quadriceps, Glutes, Hamstrings, Core", "level": "Intermediate–Advanced", "equipment": "Barbell and Rack", "steps": ["Set the bar at upper chest height. Step under it, bar resting across your upper traps. Hands just wider than shoulders.", "Step back with two steps. Feet shoulder-width, toes slightly out.", "Inhale deeply, brace your core hard, push knees out and sit down and back.", "Lower until thighs are parallel to the floor or below.", "Drive through your whole foot to stand, exhaling at the top."], "cues": ["Bar rests on upper TRAPS not the neck — it should feel comfortable with proper positioning", "BRACE hard before descending — 360° of pressure around your entire midsection", "Push the KNEES OUT over the toes throughout — not caving inward", "Drive the floor AWAY — think of pushing the ground down, not standing up"], "breath": "Take a big breath in at the top, brace your entire core (Valsalva method). Drive up and exhale at the top. For heavy loads only use Valsalva — for lighter loads breathe normally.", "pf": "The barbell squat loads the pelvic floor significantly. A strong pelvic floor is required before heavy loading. Exhale on the way up. If you notice leaking or heaviness reduce load dramatically and address pelvic floor strength first. Not recommended for early postpartum clients."}, {"id": "bulgarian", "name": "Bulgarian Split Squat", "category": "legs", "muscle": "Glutes, Quadriceps, Hamstrings", "level": "Intermediate–Advanced", "equipment": "Bench · Dumbbells optional", "steps": ["Stand two feet in front of a bench. Place the top of your back foot on the bench.", "Hold dumbbells at sides. Front foot flat on floor, directly under hips.", "Lower your back knee toward the floor, keeping torso upright.", "Lower until front thigh is roughly parallel to the floor.", "Drive through the front heel to press back up. Complete all reps then switch."], "cues": ["Front foot far enough forward that knee stays behind toes at the bottom", "Torso stays upright — slight hinge from hips only, not the chest", "Drive through the FRONT heel — this loads the glute", "Control the descent — 3 seconds down makes this dramatically more effective"], "breath": "Inhale as you lower slowly. Exhale as you drive up through the front heel. The exhale on the hardest part gives you power.", "pf": "Single leg exercise that significantly challenges pelvic stability. Keep pelvis level — no dropping on the side of the elevated leg. Exhale on the drive up and let the pelvic floor lift with the breath. Regress to a standard lunge if pelvic instability is present."}, {"id": "lunge", "name": "Reverse Lunge", "category": "legs", "muscle": "Glutes, Quadriceps", "level": "Beginner–Intermediate", "equipment": "Bodyweight or Dumbbells", "steps": ["Stand tall, feet together. Dumbbells at sides or hands on hips.", "Step one foot BACK 2–3 feet and lower the back knee toward the floor.", "Lower until front thigh is parallel to the floor, back knee hovers above ground.", "Drive through the FRONT heel to step back to standing.", "Alternate legs or complete all reps on one side."], "cues": ["Long step back — a longer stride activates the glute more than a short stride", "Front knee stays stacked over ankle — not pushing past your toes", "Torso upright — chest open, shoulders back, core gently braced", "Push through the FRONT heel to stand — not the back toes"], "breath": "Inhale as you step back and lower. Exhale as you drive through the front heel and return to standing.", "pf": "Keep pelvis stable and level with each rep — do not let one hip hike up. As you exhale and stand, your pelvic floor gently lifts. If you notice leaking or downward pressure, slow down and focus on the breath connection."}, {"id": "walkinglunge", "name": "Walking Lunge", "category": "legs", "muscle": "Glutes, Quadriceps, Hamstrings", "level": "Intermediate", "equipment": "Bodyweight or Dumbbells", "steps": ["Stand tall holding dumbbells at your sides.", "Step forward with your right foot and lower your left knee toward the floor.", "Lower until both knees are at 90°, back knee hovering just above the floor.", "Drive through the front heel and step forward with the left foot into the next lunge.", "Continue walking forward alternating legs for the desired distance or reps."], "cues": ["Long stride forward — shorter strides shift load to the quads, longer strides load the glutes", "Front knee stays over ankle — not caving in or pushing too far forward", "Stay TALL through the torso — do not let the chest drop", "Smooth rhythm — each step flows into the next without pausing"], "breath": "Exhale as you step and lower into each lunge. Inhale as you drive up. Keep a consistent breathing rhythm as you walk forward.", "pf": "The dynamic nature requires consistent pelvic stability rep after rep. Keep hips level with each stride. Exhale on the driving phase. This is a more advanced variation — master the reverse lunge first."}, {"id": "stepup", "name": "Step Up", "category": "legs", "muscle": "Glutes, Quadriceps, Hip Stabilizers", "level": "Beginner–Intermediate", "equipment": "Box or Step · Dumbbells optional", "steps": ["Stand facing a box or step. Hold dumbbells at your sides if using.", "Place your right foot fully on the box — the whole foot flat.", "Drive through the RIGHT heel to step up, bringing the left foot up to meet it.", "Stand tall at the top then slowly lower the left foot back down.", "Complete all reps on the right then switch to the left."], "cues": ["Drive through the TOP heel — the working leg does all the effort, no pushing off the bottom foot", "Full foot on the box — not just the toes perched on the edge", "Stand TALL at the top before lowering — do not rush through", "Control the lowering — slow eccentric builds the most strength"], "breath": "Exhale as you drive up through the top heel. Inhale as you lower back down with control.", "pf": "Step ups are pelvic floor friendly due to the controlled single leg nature. Exhale on the drive up. Ensure pelvis stays level when stepping up — no hiking the hip on the non-working side. Great for postpartum clients progressing toward more challenging leg work."}, {"id": "legpress", "name": "Leg Press", "category": "legs", "muscle": "Quadriceps, Glutes, Hamstrings", "level": "Beginner", "equipment": "Leg Press Machine", "steps": ["Sit in the leg press with your lower back and glutes flat against the pad.", "Place feet shoulder-width apart in the middle of the platform — or higher to target glutes more.", "Release the safety handles. Lower the platform slowly until knees are at about 90°.", "Press through the entire foot to drive the platform back up — do not lock the knees out.", "Re-engage the safety before resting."], "cues": ["Do NOT let your lower back peel off the pad at the bottom — this is a spine injury risk", "Do not lock the knees out at the top — keep a soft bend always", "Higher foot placement on the platform = more glute, lower = more quad", "Press through the WHOLE foot — heel, mid-foot and forefoot all engaged"], "breath": "Inhale as you lower the platform. Exhale as you press it away. Never hold your breath under heavy loads.", "pf": "The leg press significantly loads the pelvic floor especially with heavy weight and full depth. Exhale on every press. If you notice any leaking or pressure reduce the weight and ensure you are exhaling on every rep. Not ideal for clients with significant pelvic floor weakness without modification."}, {"id": "legcurl", "name": "Lying Leg Curl", "category": "legs", "muscle": "Hamstrings", "level": "Beginner", "equipment": "Leg Curl Machine", "steps": ["Lie face down on the machine with the pad resting just above your heels and your knees at the edge of the bench.", "Hold the handles. Hips stay flat on the bench throughout.", "Curl your heels toward your glutes in a smooth arc.", "Squeeze the hamstrings at the top for 1 second.", "Lower slowly back to the start — 3 seconds down."], "cues": ["Hips stay FLAT on the bench — do not lift your hips to get more range", "Squeeze at the TOP — feel the hamstring contraction fully", "SLOW the lowering — the eccentric is where hamstring development happens", "Do not use momentum — a full range slow curl beats a fast half range every time"], "breath": "Exhale as you curl the heels up. Inhale as you lower slowly back down.", "pf": "Low pelvic floor risk due to the prone position. Breathe with every rep — no breath holding. Core stays gently engaged throughout."}, {"id": "legext", "name": "Leg Extension", "category": "legs", "muscle": "Quadriceps", "level": "Beginner", "equipment": "Leg Extension Machine", "steps": ["Sit in the machine with your back flat against the pad, knees at the edge of the seat.", "Place the pad just above your ankles. Hold the handles.", "Extend your legs to straight, squeezing the quads at full extension.", "Hold the contraction for 1 second.", "Lower slowly back to the starting position — 3 seconds down."], "cues": ["Full extension at the top — straighten the legs completely for maximum quad activation", "Squeeze at the TOP — that peak contraction is the key to building the quads", "SLOW the lowering — 3 seconds down for maximum muscle stimulus", "Avoid locking the knees with excessive force — smooth controlled extension"], "breath": "Exhale as you extend the legs up. Inhale as you lower slowly back down.", "pf": "Very low pelvic floor risk. Seated position with minimal spinal loading. Breathe with every rep. Note: research shows leg extensions best serve as an accessory movement after compound exercises, not as a primary quad builder."}, {"id": "sumo", "name": "Sumo Squat", "category": "legs", "muscle": "Inner Thighs, Glutes, Quadriceps", "level": "Beginner", "equipment": "Dumbbell or Kettlebell", "steps": ["Stand with feet wider than shoulder-width, toes turned out 45°. Hold a dumbbell vertically in both hands in front of you.", "Keep your chest tall and brace your core.", "Lower straight down between your legs — not forward — keeping your torso upright.", "Lower until thighs are parallel to the floor or as deep as comfortable.", "Drive through the whole foot to press back up. Squeeze glutes and inner thighs at the top."], "cues": ["Lower STRAIGHT DOWN — not forward. The wide stance means you sink between your legs.", "Knees track over toes — push them out in line with your turned-out toes", "Squeeze the INNER THIGHS and glutes at the top — you should feel both", "Keep the dumbbell close to your body throughout"], "breath": "Inhale at the top before descending. Exhale as you press back up to standing.", "pf": "Sumo stance reduces forward lean and makes this friendlier for the pelvic floor than a narrow squat. Exhale on the way up. Allow the pelvic floor to naturally lift with the exhale. Good option for clients with pelvic floor sensitivity."}, {"id": "wallsit", "name": "Wall Sit", "category": "legs", "muscle": "Quadriceps, Glutes", "level": "Beginner", "equipment": "Bodyweight", "steps": ["Stand with your back against a smooth wall. Feet hip-width apart, about 2 feet from the wall.", "Slide your back down the wall until your thighs are parallel to the floor.", "Your back should be flat against the wall, knees directly over ankles at 90°.", "Hold this position for the desired duration.", "Slide back up the wall to finish."], "cues": ["Thighs PARALLEL to the floor — not too high or too low. 90° at the knee is the target.", "Feet directly under your knees — not too far out or too close", "Back flat against the wall — do not let the lower back arch away", "Breathe steadily throughout — do not hold your breath"], "breath": "Breathe steadily and rhythmically throughout. Do not hold your breath. Try inhaling for 4 counts and exhaling for 4 counts. Maintaining breathing during isometric holds is the key skill.", "pf": "Wall sits create sustained intra-abdominal pressure. Ensure steady breathing throughout. If you feel downward pelvic pressure, shorten the hold time. Exhale on any brief recovery breaths between holds. Good for quad endurance without impact."}, {"id": "goodmorning", "name": "Good Morning", "category": "legs", "muscle": "Hamstrings, Gluteus Maximus, Lower Back", "level": "Intermediate", "equipment": "Barbell or Resistance Band", "steps": ["Stand with feet hip-width apart. Bar resting on upper traps (or band behind neck). Arms crossed to hold bar.", "Brace your core and maintain a neutral spine throughout.", "With a soft bend in the knees, hinge forward from the hips until your torso is roughly parallel to the floor.", "Feel the stretch through the hamstrings at the bottom.", "Drive hips forward and squeeze glutes to return upright."], "cues": ["This is a HIP HINGE — the movement comes from pushing the hips back, not bending at the waist", "Flat back throughout — no rounding of the lower back", "Soft bend in the knees — consistent throughout, not a squatting motion", "Feel the HAMSTRING STRETCH — that stretch-under-load is what makes this effective"], "breath": "Inhale before you hinge. Hold a gentle brace as you lower. Exhale as you drive the hips forward to stand.", "pf": "Maintain a gentle core brace throughout. Exhale on the standing phase. Avoid excessive trunk flexion under heavy load. Not recommended for clients with lower back pain or early postpartum."}, {"id": "deadbug", "name": "Dead Bug", "category": "core", "muscle": "Transverse Abdominis, Deep Core", "level": "Beginner–Intermediate", "equipment": "Bodyweight", "steps": ["Lie on your back, arms pointing up, knees at 90° shins parallel to floor.", "Press your lower back INTO the floor and hold it there throughout.", "Slowly lower your right arm overhead and extend your left leg straight simultaneously.", "Stop just before touching the floor. Breathe out fully.", "Return both to start slowly. Repeat on the opposite side."], "cues": ["Lower back MUST stay pressed into the floor — the moment it lifts, stop and reset", "Move SLOWLY — 3–5 seconds each direction. Speed ruins this exercise.", "Only go as far as you can while keeping the lower back flat", "Opposite arm and leg — the diagonal pattern is what activates the deep core"], "breath": "This is a breathing exercise as much as a core exercise. Inhale at the top. Exhale slowly and fully as you lower arm and leg — the exhale draws in the deep core. The longer your exhale, the greater the transverse abdominis activation.", "pf": "One of the best exercises for pelvic floor and core coordination. As you exhale and extend, feel your lower belly draw gently in and your pelvic floor gently lift. This is the natural breath-core-pelvic floor connection. Foundation exercise for postpartum clients, back pain, and all beginners."}, {"id": "birddog", "name": "Bird Dog", "category": "core", "muscle": "Deep Core, Glutes, Multifidus", "level": "Beginner–Intermediate", "equipment": "Bodyweight", "steps": ["Start on all fours, hands under shoulders, knees under hips, neutral spine.", "Gently brace your core. Extend your right arm forward and left leg back simultaneously.", "Hold 2–3 seconds at full extension. Hips perfectly level — no rotation.", "Return arm and leg to floor with control. Repeat on the opposite side.", "8 slow, quality reps per side beats 20 rushed ones."], "cues": ["HIPS STAY LEVEL — put a water bottle on your lower back to check for rotation", "Reach LONG through the arm and leg — create length, not just height", "Core braces FIRST, then the limbs move", "Chin tucked — the back of the neck stays long throughout"], "breath": "Inhale at the start position. Exhale slowly as you extend arm and leg. Inhale as you return. The exhale activates the transverse abdominis — the most important deep core muscle.", "pf": "Quadruped position reduces gravity load on the pelvic floor — ideal for postnatal and pelvic floor rehab. As you extend, your pelvic floor gently activates to stabilize the pelvis. Focus on level hips — dropping one side indicates pelvic instability."}, {"id": "plank", "name": "Forearm Plank", "category": "core", "muscle": "Full Core, Shoulders, Glutes", "level": "Beginner–Intermediate", "equipment": "Bodyweight", "steps": ["Start on forearms, elbows directly under shoulders. Hands flat or clasped.", "Step feet back — body forms one straight diagonal line from head to heels.", "Hips level — not sagging down or piking up.", "Squeeze glutes and pull elbows toward feet (you won't move but this activates the core deeply).", "Breathe steadily. Start with 20–30 seconds and build over time."], "cues": ["Body in ONE straight line — imagine a wooden plank from head to heels", "Glutes SQUEEZED — often forgotten but dramatically increases core activation", "Do NOT hold your breath — breathing while holding position is the real skill", "If hips sag, drop to knees. A quality 20 sec plank beats a sagging 60 sec one."], "breath": "Breathe steadily and rhythmically throughout. Try inhaling 3 counts, exhaling 3 counts. Maintaining core stability while breathing is the true skill of the plank.", "pf": "The plank increases intra-abdominal pressure. For clients with pelvic floor weakness, start with shorter holds and ensure steady breathing. If they cannot breathe normally during the plank, reduce duration or regress to a knee plank. Breath holding during a plank puts excessive downward pressure on the pelvic floor."}, {"id": "sideplank", "name": "Side Plank", "category": "core", "muscle": "Obliques, Gluteus Medius, Core", "level": "Intermediate", "equipment": "Bodyweight", "steps": ["Lie on your side, elbow under shoulder, feet stacked or staggered for stability.", "Lift your hips off the floor, creating a straight line from head to feet.", "Top arm can rest on your hip or reach toward the ceiling.", "Hold for the desired duration, maintaining a straight body line.", "Lower with control and switch sides."], "cues": ["Hips up and FORWARD — do not let them sag backward or toward the floor", "Body in one straight line from head to feet — no bending at the hips", "The bottom shoulder blade stays pulled down and back — no shrugging", "Breathe steadily — do not hold your breath"], "breath": "Breathe steadily throughout. Inhale through the nose, exhale through the mouth. Maintaining breath while holding lateral tension is the key skill.", "pf": "Side plank targets the obliques and gluteus medius — both important pelvic stabilizers. Keep breathing steadily. If you feel downward pelvic pressure on the bottom side, reduce hold time. Good exercise for building the lateral core stability that protects the pelvic floor during dynamic activities."}, {"id": "pallof", "name": "Pallof Press", "category": "core", "muscle": "Transverse Abdominis, Obliques", "level": "Intermediate", "equipment": "Cable Machine or Resistance Band", "steps": ["Attach a band or cable at chest height. Stand sideways to the anchor.", "Hold at your chest with both hands. Feet shoulder-width apart, soft knees.", "Brace your core. Press both hands straight out until arms are fully extended.", "Hold 2 seconds — resist the pull trying to rotate you.", "Pull back to chest slowly. Complete all reps then switch sides."], "cues": ["RESIST THE ROTATION — the band wants to pull you toward it. Your core resists. That is the exercise.", "Hips and shoulders stay SQUARE — no rotating toward or away from the anchor", "Brace BEFORE you press — core engages first, then arms move", "Stand far enough from anchor that there is real tension throughout"], "breath": "Exhale as you press out and hold the resistance. Inhale as you pull back to chest. The exhale deeply engages the transverse abdominis — the anti-rotation corset muscle.", "pf": "Trains the core to resist rotation — one of its primary real-life functions. Exhale on the press to engage the pelvic floor naturally with the breath. Excellent for pelvic stability as it trains deep core without compression. Great for postpartum clients progressing beyond foundation exercises."}, {"id": "abwheel", "name": "Ab Wheel Rollout", "category": "core", "muscle": "Transverse Abdominis, Rectus Abdominis, Lats", "level": "Advanced", "equipment": "Ab Wheel", "steps": ["Kneel on the floor with the ab wheel in front of you under your shoulders.", "Brace your core hard — think of protecting your spine from a punch.", "Roll the wheel slowly forward, keeping your arms straight and core rigid.", "Go as far as you can while maintaining a flat back — stop before the back arches.", "Roll back to the start using your core and lats — do not collapse."], "cues": ["Core BRACED hard before you move — this is non-negotiable or you risk lower back injury", "Go only as far as you can with a FLAT back — this is where most people make their mistake", "Think of pulling from your LATS on the way back — arms and core working together", "Start with a shorter range and build — a 6 inch rollout with perfect form beats a full rollout with an arched back"], "breath": "Inhale before you roll out. Exhale as you roll back in. Do not hold your breath during the extended position.", "pf": "High demand on the pelvic floor due to the extended position and high intra-abdominal pressure. Not appropriate for clients with pelvic floor weakness or early postpartum. Master all foundation and intermediate core exercises before attempting. If you feel downward pelvic pressure at any point stop immediately."}, {"id": "mcgillcurl", "name": "McGill Curl Up", "category": "core", "muscle": "Rectus Abdominis, Deep Core", "level": "Beginner", "equipment": "Bodyweight", "steps": ["Lie on your back. One knee bent, one leg flat. Place your hands under your lower back to maintain its natural curve.", "Do not flatten your lower back — keep the natural arch supported by your hands.", "Lift your head and shoulders SLIGHTLY off the floor — only 2–3 inches.", "Hold for 8–10 seconds. Lower slowly.", "Repeat on the same setup — this is not a full sit-up. Small range, maximum tension."], "cues": ["This is NOT a crunch — you lift only 2–3 inches. The small range is intentional and backed by science.", "Keep the lower back NEUTRAL — your hands under the lower back ensure this", "Do not pull on your neck — elbows stay wide, hands just supporting", "Think of STIFFENING the entire core — not crunching toward your knees"], "breath": "Exhale gently as you lift. Hold the breath during the hold. Inhale as you lower. The stiffness of the core is what builds the benefit here.", "pf": "The McGill curl-up is research-backed as a spine-safe core exercise that avoids excessive disc compression. Lower demand on the pelvic floor than traditional crunches. Good for clients with back pain or pelvic floor sensitivity. Recommended by Dr. Stuart McGill for spinal rehabilitation."}, {"id": "hollowbody", "name": "Hollow Body Hold", "category": "core", "muscle": "Deep Core, Hip Flexors, Rectus Abdominis", "level": "Intermediate", "equipment": "Bodyweight", "steps": ["Lie on your back, arms extended overhead, legs straight.", "Press your lower back firmly into the floor — this is the entire key to the exercise.", "Lift your arms, head, shoulders and legs off the floor simultaneously.", "Hold this curved 'hollow' body position. Only lift as high as you can while keeping the lower back on the floor.", "Lower with control and rest."], "cues": ["Lower back MUST stay on the floor — if it lifts, bend the knees to make it easier", "Think of 'scooping' the lower belly — pull the navel toward the floor", "Arms reach LONG overhead — the length creates the tension", "Start with bent knees or just arms up to find the position before fully extending"], "breath": "Breathe steadily throughout the hold. Exhale to engage the core more deeply. Do not hold your breath during this exercise.", "pf": "Significant demand on the pelvic floor due to the sustained position with legs raised. Not appropriate for early postpartum or pelvic floor weakness. Breathe steadily throughout — holding breath increases downward pressure on the pelvic floor. Master the dead bug before attempting."}, {"id": "suitcasecarry", "name": "Suitcase Carry", "category": "core", "muscle": "Obliques, Core, Grip, Trapezius", "level": "Intermediate", "equipment": "Dumbbell or Kettlebell", "steps": ["Hold a moderately heavy dumbbell in one hand at your side. Stand tall.", "Walk forward maintaining a perfectly upright posture — do not lean toward or away from the weight.", "The weight wants to pull you sideways — your core resists this constantly.", "Walk for the desired distance then switch hands.", "Prioritize posture over speed — slow and controlled walking."], "cues": ["Stay TALL — no leaning toward or away from the weight. Perfectly upright.", "Resist the side pull — the obliques and core are working constantly to keep you vertical", "Do not let the shoulder on the weighted side hike up — keep it packed down", "This is a walking exercise — slow, deliberate steps"], "breath": "Breathe normally throughout. Exhale every few steps. The challenge is maintaining stable breathing and posture simultaneously.", "pf": "The anti-lateral flexion demand trains the core to resist sideways pull — one of its key functions. Keep breathing steadily. The pelvic floor must work to stabilize the pelvis during this walking anti-rotation exercise. Do not use so much weight that your posture breaks down."}, {"id": "copenhagenplank", "name": "Copenhagen Plank", "category": "core", "muscle": "Inner Thighs, Core, Gluteus Medius", "level": "Advanced", "equipment": "Bench", "steps": ["Lie on your side. Place your top foot on a bench. Bottom leg is free in the air.", "Push up through your top foot to lift your hips, supporting yourself on your top foot and bottom forearm.", "Hold this position with your body in a straight line.", "The bottom leg can be bent or straight for more difficulty.", "Hold for time then switch sides."], "cues": ["Body in one STRAIGHT line from head to foot — no bending at the hips", "The top foot drives DOWN into the bench — this is the working movement", "Adductors (inner thigh) of the top leg do most of the work", "This is extremely challenging — start with short holds and build"], "breath": "Breathe steadily throughout. Do not hold your breath. Maintaining breath during this challenging hold is key to pelvic floor safety.", "pf": "The Copenhagen plank is extremely demanding on the pelvic floor due to the sustained position and adductor loading. Not appropriate for pelvic floor weakness, prolapse, or early postpartum. Breathe steadily throughout. Master all other core exercises before attempting."}, {"id": "russiantwist", "name": "Russian Twist", "category": "core", "muscle": "Obliques, Rectus Abdominis", "level": "Intermediate", "equipment": "Bodyweight or Medicine Ball", "steps": ["Sit on the floor with knees bent, feet flat or raised. Lean back slightly so your torso is at 45°.", "Hold a weight or clasp your hands. Brace your core.", "Rotate your torso to the RIGHT, bringing the weight toward the floor beside your hip.", "Rotate back through center to the LEFT. That is one rep.", "Keep the movement controlled — no flailing or swinging."], "cues": ["Rotate from the TORSO — not just the arms. Your chest turns toward each side.", "Keep your chest TALL — do not collapse or hunch as you rotate", "Control both directions — the return is just as important as the rotation", "Go SLOW and controlled rather than fast and sloppy"], "breath": "Exhale as you rotate to each side. Inhale briefly at center. Keep a rhythmic breathing pattern throughout.", "pf": "Rotational exercises challenge the pelvic floor with changing demands. Keep breathing throughout — do not hold your breath. If you feel downward pressure, modify by keeping feet on the floor and reducing the range of rotation. Not ideal for early postpartum without clearance from a pelvic floor physio."}, {"id": "hangingkneeraise", "name": "Hanging Knee Raise", "category": "core", "muscle": "Rectus Abdominis, Hip Flexors, Core", "level": "Intermediate–Advanced", "equipment": "Pull-Up Bar", "steps": ["Hang from a pull-up bar with a shoulder-width grip, arms fully extended.", "Brace your core and pull your shoulder blades down and back — do not let them shrug up.", "Bring your knees up toward your chest by curling your lower body upward.", "Hold briefly at the top before lowering slowly.", "Lower with control — do not swing back. Control the descent."], "cues": ["Pull shoulder blades DOWN before raising knees — protects your shoulders", "Curl the HIPS upward — not just lifting the knees. A posterior pelvic tilt at the top maximizes ab work.", "No swinging — slow controlled movement is far more effective than momentum", "Lower slowly — the eccentric phase is where the core is really challenged"], "breath": "Exhale as you raise your knees up. Inhale as you lower slowly back down.", "pf": "Hanging exercises increase intra-abdominal pressure significantly. Exhale on the raise. Not appropriate for pelvic floor weakness, prolapse, or early postpartum. Master all floor-based core exercises before attempting hanging variations."}, {"id": "row", "name": "Dumbbell Row", "category": "upper", "muscle": "Latissimus Dorsi, Rhomboids, Biceps", "level": "Beginner–Intermediate", "equipment": "Dumbbell · Bench", "steps": ["Place one hand and same-side knee on a bench. Hold dumbbell in opposite hand.", "Back flat, roughly parallel to the floor. Arm hangs straight from shoulder.", "Drive your elbow straight back toward your hip — elbow leads the movement.", "Pull until dumbbell reaches your ribcage. Squeeze shoulder blade toward spine at top.", "Lower slowly to full arm extension. Complete all reps then switch sides."], "cues": ["ELBOW drives back toward the hip — not out to the side", "Squeeze the shoulder blade at the top — this is what builds back definition", "Do not rotate your torso — hips and shoulders stay square to the floor", "Full extension at the bottom — let the lat stretch before pulling again"], "breath": "Exhale as you pull the weight up. Inhale as you lower with control. The exhale on the pull engages your core and protects your spine.", "pf": "Braced position with one hand on a bench keeps spinal loading low. Exhale on each pull — this naturally activates core and pelvic floor together. Great early strength exercise for postpartum clients due to the supported position."}, {"id": "seatedrow", "name": "Seated Cable Row", "category": "upper", "muscle": "Latissimus Dorsi, Rhomboids, Rear Deltoid, Biceps", "level": "Beginner", "equipment": "Cable Machine", "steps": ["Sit at a cable row machine, feet on the platform, knees slightly bent. Grip the handle with both hands.", "Sit tall, chest up — do not let the cable pull you forward into a rounded position.", "Drive both elbows back simultaneously, pulling the handle toward your lower ribcage.", "Squeeze your shoulder blades together firmly at the end of the pull.", "Return slowly to the start, letting your shoulders stretch forward slightly."], "cues": ["Sit TALL throughout — posture is everything in this exercise", "Drive the ELBOWS back — not the hands", "Squeeze the shoulder blades TOGETHER at the end — feel it between your shoulder blades", "Control the return — do not let the cable yank you forward"], "breath": "Exhale as you pull the handle toward you. Inhale as you return the cable forward.", "pf": "Low pelvic floor risk due to seated supported position. Exhale on each pull. Keep breathing rhythmically. Great for building the upper back strength that improves posture and reduces lower back strain."}, {"id": "latpulldown", "name": "Lat Pulldown", "category": "upper", "muscle": "Latissimus Dorsi, Biceps, Rear Deltoid", "level": "Beginner", "equipment": "Cable Machine", "steps": ["Sit at the pulldown machine, thighs secured under the pads. Grip the bar wider than shoulder-width.", "Lean back slightly (10–15°) with chest tall. This is your starting position.", "Pull the bar down to your upper chest by driving your elbows toward your hips.", "Squeeze your lats at the bottom. Hold 1 second.", "Return the bar slowly to the start — feel the lat stretch at the top."], "cues": ["Think of driving your ELBOWS DOWN to your hips — not pulling with your hands", "Chest reaches up to the bar — not the bar pulling to a collapsed chest", "Squeeze at the BOTTOM — feel the lats fully contracted", "Slow the return — the lat stretch at the top is an important part of the exercise"], "breath": "Exhale as you pull the bar down. Inhale as you return it to the top.", "pf": "Low pelvic floor risk in the seated position. Exhale on each pulldown. Breathe rhythmically throughout. Building lat strength improves overall trunk stability which supports the pelvic floor indirectly."}, {"id": "pushup", "name": "Push Up", "category": "upper", "muscle": "Pectorals, Shoulders, Triceps, Core", "level": "Beginner–Intermediate", "equipment": "Bodyweight", "steps": ["High plank position, hands slightly wider than shoulder-width. Body in one straight line.", "Brace core and squeeze glutes. Bend elbows to lower chest toward the floor.", "Lower until chest is about one inch from the floor. Elbows at 45° from body.", "Press through hands to push back up to start.", "Modification: knees on the floor with feet crossed. Same core and breathing principles apply."], "cues": ["Body as ONE PIECE — core and glutes squeezed throughout. No sagging hips.", "Elbows at 45° — not flaring wide (shoulder injury risk) or tucked straight back", "Chest to FLOOR — a half push up is only half as effective", "Proud chest at the top — push the floor away and spread the shoulder blades"], "breath": "Inhale as you lower down. Exhale as you push up. The exhale powers the hardest part of the movement.", "pf": "Push ups significantly increase intra-abdominal pressure. Exhale on the push — essential to protect the pelvic floor. For clients with pelvic floor weakness, start with hands on a bench (incline). If leaking occurs during push ups, elevate the surface until pelvic floor strength improves."}, {"id": "inclinepress", "name": "Incline Dumbbell Press", "category": "upper", "muscle": "Upper Pectorals, Anterior Deltoid, Triceps", "level": "Intermediate", "equipment": "Incline Bench · Dumbbells", "steps": ["Set a bench to 30–45°. Lie back with dumbbells at shoulder height, palms facing forward.", "Plant your feet firmly on the floor. Arch slightly through the upper back only.", "Press both dumbbells up and slightly toward each other in an arc — do not lock out elbows fully.", "Lower slowly back to the starting position — elbows at 45° to your body.", "Control the descent — 2–3 seconds down."], "cues": ["45° incline targets the upper chest specifically — do not go too upright or it becomes a shoulder press", "Elbows at 45° on the way down — not flaring wide or tucking straight back", "Press up and SLIGHTLY TOGETHER — a slight arc at the top increases chest activation", "Control the descent — the eccentric here is where upper chest development happens"], "breath": "Exhale as you press the dumbbells up. Inhale as you lower them with control.", "pf": "Moderate pelvic floor demand in the lying position. Exhale on the press. Breathe with every rep. Core stays gently engaged throughout to protect the lower back."}, {"id": "chestfly", "name": "Dumbbell Chest Fly", "category": "upper", "muscle": "Pectorals, Anterior Deltoid", "level": "Intermediate", "equipment": "Flat Bench · Dumbbells", "steps": ["Lie flat on a bench, dumbbell in each hand. Press them straight up — this is your start position.", "Open your arms in a wide arc, lowering the dumbbells toward the sides with a slight bend in the elbows.", "Lower until you feel a deep stretch across your chest — usually arms roughly parallel to the floor.", "Bring the dumbbells back up in the same arc, squeezing your chest at the top.", "This is a stretch and squeeze movement — not a pressing movement."], "cues": ["Slight bend in the ELBOWS throughout — not straight arms, not a full bend", "Feel the STRETCH at the bottom — that stretch under load is what makes the fly effective", "Squeeze the CHEST at the top — think of hugging a large tree", "This is NOT a pressing exercise — it is a fly. The weight is lighter than a press for good reason."], "breath": "Inhale as you open the arms and lower. Exhale as you bring the arms back together and squeeze.", "pf": "Low-moderate pelvic floor demand in the lying position. Exhale on the return and squeeze. Breathe rhythmically with every rep."}, {"id": "overheadpress", "name": "Dumbbell Overhead Press", "category": "upper", "muscle": "Deltoids, Triceps, Upper Trapezius", "level": "Beginner–Intermediate", "equipment": "Dumbbells", "steps": ["Sit or stand. Hold dumbbells at shoulder height, palms facing forward. Elbows at 90°.", "Brace your core. Press both dumbbells straight up until arms are almost fully extended.", "Dumbbells end up slightly in front of your face — not directly overhead — for shoulder health.", "Lower slowly back to shoulder height. 2–3 seconds down.", "Keep your lower back neutral throughout — no excessive arching."], "cues": ["Core BRACED — do not let your lower back arch excessively as you press up", "Press up and SLIGHTLY in front of you — directly overhead can impinge the shoulder joint", "Control the lowering — 2–3 seconds down for maximum shoulder development", "Do not lock the elbows out at the top — keep a soft bend always"], "breath": "Exhale as you press the dumbbells up. Inhale as you lower them back to shoulder height.", "pf": "Overhead pressing increases intra-abdominal pressure. Exhale on the press. Keep core braced to prevent the lower back from arching. Seated position reduces pelvic floor demand. If standing, ensure the core is fully braced before each rep."}, {"id": "arnoldpress", "name": "Arnold Press", "category": "upper", "muscle": "All Three Deltoid Heads, Triceps", "level": "Intermediate", "equipment": "Dumbbells", "steps": ["Hold dumbbells in front of your face, palms facing YOU, elbows at 90° — like the top of a curl.", "As you press up, rotate your palms to face FORWARD in a smooth arc.", "At the top, dumbbells are overhead with palms facing forward — just like a standard press.", "Reverse the rotation as you lower, returning to palms facing you at shoulder height.", "The rotation recruits all three deltoid heads — front, side and rear."], "cues": ["The ROTATION is the whole point — don't skip it or turn it into a regular press", "Smooth continuous arc from start to finish — rotation and press happen simultaneously", "Control both phases — the lowering with rotation is just as important as the press", "Lighter weight than a standard press is normal — this exercise has a longer range of motion"], "breath": "Exhale as you press and rotate up. Inhale as you rotate and lower back to the start.", "pf": "Moderate pelvic floor demand. Core brace essential to prevent lower back arching. Exhale on each press. Seated variation reduces pelvic demand. Breathe with every rep."}, {"id": "frontraise", "name": "Front Raise", "category": "upper", "muscle": "Anterior Deltoid", "level": "Beginner", "equipment": "Dumbbells", "steps": ["Stand tall, dumbbell in each hand at your sides or in front of your thighs. Slight bend in elbows.", "Raise both arms simultaneously straight in front of you to shoulder height.", "Hold briefly at the top.", "Lower slowly back to the start — 3 seconds down.", "Keep your torso from swinging or leaning back."], "cues": ["Raise to SHOULDER HEIGHT only — going higher shifts the work to the trapezius", "No swinging or using momentum — if you are swinging, the weight is too heavy", "SLOW the lowering — that controlled descent is where the anterior deltoid is best worked", "Slight bend in elbows maintained throughout — not straight arms"], "breath": "Exhale as you raise the arms forward. Inhale as you lower slowly back down.", "pf": "Low pelvic floor risk. Maintain a gentle core brace throughout to prevent lower back arching. Breathe with every rep."}, {"id": "facepull", "name": "Face Pull", "category": "upper", "muscle": "Rear Deltoid, Rotator Cuff, Rhomboids", "level": "Beginner", "equipment": "Cable Machine or Resistance Band", "steps": ["Set a cable or band at upper face height. Grip a rope attachment with both hands, palms facing in.", "Step back to create tension. Feet shoulder-width, soft knees.", "Pull the rope toward your FACE, spreading the handles apart as you pull.", "At the end of the pull, hands should be beside your ears, elbows high and wide.", "Return slowly to the start — control the tension throughout."], "cues": ["Pull toward your FACE — not your chest or neck", "Elbows finish HIGH and WIDE — above the level of your hands", "Spread the handles APART as you pull — the external rotation is what heals the rotator cuff", "Light weight with full range is far better than heavy weight with partial range"], "breath": "Exhale as you pull toward your face. Inhale as you return slowly.", "pf": "Very low pelvic floor risk. Excellent exercise for postural correction and rotator cuff health. Breathe with every rep. Can be done standing or seated."}, {"id": "bandpullapart", "name": "Band Pull Apart", "category": "upper", "muscle": "Rear Deltoid, Rhomboids, Rotator Cuff", "level": "Beginner", "equipment": "Resistance Band", "steps": ["Hold a resistance band with both hands shoulder-width apart in front of your chest. Arms almost straight.", "With a slight bend in the elbows, pull the band apart by squeezing your shoulder blades together.", "Pull until the band touches your chest and your arms are fully out to the sides.", "Hold 1 second and feel the rear delts and rhomboids contracting.", "Return slowly to the start with control."], "cues": ["SQUEEZE the shoulder blades together as you pull apart — that is the work", "Slight bend in the elbows — not fully straight or fully bent", "Keep your arms at chest height throughout — do not drop them as you pull", "Slow the return — control the band back to the start"], "breath": "Exhale as you pull the band apart and squeeze. Inhale as you return to the start.", "pf": "Very low pelvic floor risk. Excellent for posture correction. Can be done anywhere. Breathe with every rep. One of the most underrated exercises for building the rear shoulder and upper back."}, {"id": "reardelt", "name": "Rear Delt Fly", "category": "upper", "muscle": "Posterior Deltoid, Rhomboids", "level": "Beginner–Intermediate", "equipment": "Dumbbells", "steps": ["Stand, feet hip-width. Hinge forward from hips about 45°. Flat back.", "Hold a light dumbbell in each hand hanging below chest, slight bend in elbows.", "Raise both arms out to the sides in a wide arc — like a bird opening wings.", "Lift until arms are parallel to the floor. Squeeze shoulder blades together at top.", "Lower slowly — 3–4 seconds down."], "cues": ["LIGHT WEIGHT — this muscle is small and most people dramatically overload it", "Squeeze shoulder blades TOGETHER at the top — feel it between them", "Lead with the ELBOWS out to the sides, not the hands", "Slow the lowering — 3–4 seconds down is where the muscle change happens"], "breath": "Exhale as you raise the arms and squeeze. Inhale as you lower with control. Core engaged to support the hinged position.", "pf": "Hinged position requires good core engagement to protect the lower back. Breathe with every rep. Very low pelvic floor risk with appropriate light loads."}, {"id": "trlpushdown", "name": "Tricep Pushdown", "category": "arms", "muscle": "Triceps Brachii", "level": "Beginner", "equipment": "Cable Machine or Resistance Band", "steps": ["Stand at a cable or attach band above head height. Hold the handle with both hands.", "Elbows pinned to your sides at 90°. This starting position does not change throughout.", "Push the handle straight down extending elbows fully. Squeeze the triceps hard at the bottom.", "Hold 1 second at full extension.", "Let the handle rise slowly back to 90° — 2–3 seconds up."], "cues": ["ELBOWS STAY PINNED to your sides — they are the anchor point throughout", "Full extension at the bottom — straighten the arms completely", "Do not lean forward — stay tall and upright throughout", "SQUEEZE at the bottom — that contraction builds the back of the arm"], "breath": "Exhale as you push down. Inhale as you return slowly. Steady rhythmic breathing with every rep.", "pf": "Low pelvic floor risk. Maintain upright posture and breathe with every rep. Avoid excessive gripping or holding breath."}, {"id": "overheadtricep", "name": "Overhead Tricep Extension", "category": "arms", "muscle": "Triceps Brachii — Long Head", "level": "Beginner–Intermediate", "equipment": "Dumbbell or Cable", "steps": ["Hold a dumbbell with both hands, grip the top plate. Raise it overhead — arms almost straight.", "Sit or stand tall. Core braced.", "Bend your elbows to lower the dumbbell behind your head. Elbows point forward — not flaring out.", "Lower until you feel a deep stretch in the triceps at the back of the arm.", "Press back up to the start by straightening the elbows."], "cues": ["Elbows point FORWARD — not flaring out to the sides. This protects the shoulder joints.", "Feel the STRETCH at the bottom — the triceps long head only fully stretches in the overhead position", "Do not let the lower back arch — core stays braced throughout", "Full extension at the top but do not lock the elbows aggressively"], "breath": "Inhale as you lower the weight behind your head. Exhale as you press back up to the start.", "pf": "Moderate pelvic floor demand especially when standing. Core brace essential to prevent lower back arching under the overhead load. Seated variation reduces pelvic demand. Breathe with every rep."}, {"id": "skulcrusher", "name": "Skull Crusher", "category": "arms", "muscle": "Triceps Brachii — All Three Heads", "level": "Intermediate", "equipment": "Dumbbells or EZ Bar · Bench", "steps": ["Lie on a flat bench holding dumbbells or an EZ bar straight up over your chest.", "Keep your upper arms vertical and perfectly still throughout.", "Bend your elbows to lower the weight toward your FOREHEAD or just above your head.", "Stop just above the forehead. Hold briefly.", "Press back up by extending the elbows. Upper arms do not move."], "cues": ["Upper arms stay VERTICAL and STILL — only the forearms move in this exercise", "Lower toward the FOREHEAD — not to the nose or chin", "Control the lowering — 3 seconds down for maximum tricep development", "Do not let the elbows flare outward — keep them pointing toward the ceiling"], "breath": "Inhale as you lower toward the forehead. Exhale as you press back up.", "pf": "Low pelvic floor risk in the lying position. Breathe with every rep. Core gently engaged to protect the lower back."}, {"id": "curl", "name": "Dumbbell Bicep Curl", "category": "arms", "muscle": "Biceps Brachii", "level": "Beginner", "equipment": "Dumbbells", "steps": ["Stand or sit. Dumbbells in each hand, arms extended, palms facing forward.", "Keep elbows pinned to sides throughout — they do not move.", "Curl the weights up until forearms are vertical and weights near shoulders.", "Squeeze the bicep at top for 1 second.", "Lower SLOWLY back to full extension — 3 seconds down."], "cues": ["ELBOWS STAY PINNED to sides — the moment they swing forward you use momentum", "SLOW the lowering — 3 seconds down. The eccentric phase is the most important part.", "Full range — fully extend at bottom, fully curl at top", "Wrists stay NEUTRAL — do not let them bend back under the weight"], "breath": "Exhale as you curl up. Inhale as you lower slowly. Core gently braced to protect the lower back.", "pf": "Low risk for the pelvic floor with appropriate weight. Breathe rhythmically with every rep. Seated curls further reduce any pelvic loading for sensitive clients."}, {"id": "hammercurl", "name": "Hammer Curl", "category": "arms", "muscle": "Biceps Brachii, Brachialis", "level": "Beginner", "equipment": "Dumbbells", "steps": ["Stand or sit holding dumbbells in each hand with NEUTRAL grip — palms facing each other.", "Keep elbows pinned to sides.", "Curl both dumbbells up simultaneously keeping the neutral grip throughout.", "Squeeze at the top.", "Lower slowly back to full extension — 3 seconds down."], "cues": ["NEUTRAL GRIP throughout — palms face each other the whole way, no rotating", "The brachialis muscle beneath the bicep is the main target — this adds arm thickness", "Elbows stay pinned — no swinging forward", "SLOW the lowering — same principle as all curl variations"], "breath": "Exhale as you curl up. Inhale as you lower slowly. Steady rhythmic breathing throughout.", "pf": "Low pelvic floor risk. Breathe with every rep. Core gently engaged throughout."}, {"id": "concentrationcurl", "name": "Concentration Curl", "category": "arms", "muscle": "Biceps Brachii — Peak Contraction", "level": "Beginner", "equipment": "Dumbbell · Bench", "steps": ["Sit on a bench, feet wider than hips. Hold a dumbbell in one hand.", "Rest the back of your upper arm against your INNER thigh for full stabilization.", "Curl the dumbbell up in a controlled arc — elbow stays against the thigh.", "Squeeze hard at the top — this position maximizes the peak bicep contraction.", "Lower slowly back to full extension. Complete all reps then switch arms."], "cues": ["The arm against the thigh means ZERO momentum is possible — pure muscle work", "Squeeze HARD at the top — this exercise is famous for building the bicep peak", "Slow the lowering — 3 seconds down for maximum tension time", "Full extension at the bottom — do not stop halfway"], "breath": "Exhale as you curl up. Inhale as you lower slowly.", "pf": "Very low pelvic floor risk due to the seated stabilized position. Breathe with every rep. One of the most isolated bicep exercises available."}, {"id": "lateralraise", "name": "Lateral Raise", "category": "arms", "muscle": "Lateral Deltoid", "level": "Beginner", "equipment": "Dumbbells", "steps": ["Stand feet hip-width apart. Dumbbells at sides, slight bend in elbows.", "Slight forward lean from the hips.", "Raise both arms out to the sides — lead with ELBOWS not hands.", "Lift until arms are parallel to the floor — no higher.", "Lower slowly — 3 seconds down."], "cues": ["Lead with the ELBOWS — think of pouring water from a jug at the top", "Slight forward lean targets the lateral deltoid more effectively", "No swinging — lighter weight and controlled movement wins every time", "SLOW the lowering — the eccentric is where shoulder sculpting happens"], "breath": "Exhale as you raise the arms. Inhale as you lower slowly. Core braced to prevent lower back arching.", "pf": "Maintain gentle core brace throughout. Breathe with every rep. No breath holding. Very low pelvic floor risk."}, {"id": "reversecurl", "name": "Reverse Curl", "category": "arms", "muscle": "Brachialis, Brachioradialis, Forearms", "level": "Intermediate", "equipment": "Barbell or Dumbbells", "steps": ["Hold a barbell or dumbbells with OVERHAND grip — palms facing down.", "Elbows pinned to sides. Arms fully extended at start.", "Curl the weight up keeping the overhand grip throughout.", "Squeeze at the top of the movement.", "Lower slowly back to full const grid = document.getElementById('grid');
const resultsCount = document.getElementById('resultsCount');

function renderGrid(filtered) {
  grid.innerHTML = '';
  resultsCount.textContent = filtered.length + ' exercise' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><p style="font-family:var(--font-d);font-size:1.5rem;color:var(--text);margin-bottom:.5rem">No exercises found</p><p>Try a different search or filter</p></div>';
    return;
  }
  filtered.forEach(ex => {
    const bg = bgColors[ex.category] || bgColors.core;
    const svg = svgs[ex.category] || svgs.core;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-visual" style="background:${bg}">${svg}<div class="card-tag">${ex.category}</div></div>
      <div class="card-body">
        <div class="card-name">${ex.name}</div>
        <div class="card-muscle">${ex.muscle}</div>
        <div class="card-equip">&#x2756; ${ex.equipment}</div>
      </div>
      <div class="card-footer">
        <span class="card-level">${ex.level}</span>
        <span style="font-size:.75rem;color:var(--accent)">View &rarr;</span>
      </div>`;
    card.addEventListener('click', () => openModal(ex));
    grid.appendChild(card);
  });
}

function openModal(ex) {
  const v = document.getElementById('modalVisual');
  v.style.background = bgColors[ex.category] || bgColors.core;
  const oldSvg = v.querySelector('svg');
  if (oldSvg) oldSvg.remove();
  const tmp = document.createElement('div');
  tmp.innerHTML = svgs[ex.category] || svgs.core;
  const svgEl = tmp.firstElementChild;
  svgEl.style.cssText = 'width:120px;height:120px;opacity:0.9';
  v.insertBefore(svgEl, document.getElementById('modalClose'));

  document.getElementById('modalTag').textContent = ex.category.toUpperCase() + ' \u00b7 ' + ex.level;
  document.getElementById('modalName').textContent = ex.name;
  document.getElementById('modalMuscle').textContent = ex.muscle;
  document.getElementById('modalEquip').textContent = '\u2756 ' + ex.equipment;
  document.getElementById('modalSteps').innerHTML = ex.steps.map((s,i) => `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('');
  document.getElementById('modalCues').innerHTML = ex.cues.map(c => `<div class="cue">${c}</div>`).join('');
  document.getElementById('modalBreath').innerHTML = `<p>${ex.breath}</p>`;
  document.getElementById('modalPF').innerHTML = `<p>${ex.pf}</p>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

let activeFilter = 'all', searchQuery = '';
function filterExercises() {
  return exercises.filter(ex => {
    const mf = activeFilter === 'all' || ex.category === activeFilter;
    const q = searchQuery.toLowerCase();
    const ms = !q || ex.name.toLowerCase().includes(q) || ex.muscle.toLowerCase().includes(q) || ex.category.toLowerCase().includes(q) || ex.equipment.toLowerCase().includes(q);
    return mf && ms;
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderGrid(filterExercises());
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid(filterExercises());
  });
});

renderGrid(exercises);

</script>
