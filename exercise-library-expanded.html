<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise Library — Lavinia Calumby</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--dark:#1c1a17;--dark2:#2a2722;--accent:#8a7150;--accent-light:#c9b48e;--off-white:#f4f1eb;--warm-gray:#e8e2d8;--mid-gray:#a89e8e;--text:#4a453d;--white:#faf9f7;--font-d:'Cormorant Garamond',serif;--font-b:'DM Sans',sans-serif}
    body{background:var(--off-white);color:var(--dark);font-family:var(--font-b);font-weight:300;min-height:100vh}
    header{background:var(--dark);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
    header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 60% 0%,rgba(138,113,80,.15) 0%,transparent 70%);pointer-events:none}
    .logo{font-family:var(--font-d);font-size:1rem;color:var(--accent-light);letter-spacing:.15em;margin-bottom:.75rem;font-style:italic}
    header h1{font-family:var(--font-d);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:300;color:var(--white);line-height:1.15}
    header h1 em{font-style:italic;color:var(--accent-light)}
    header p{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mid-gray);margin-top:.75rem}
    .search-wrap{background:var(--dark2);padding:1.25rem 1.25rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(138,113,80,.2)}
    .search-inner{max-width:900px;margin:0 auto;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    .search-box{flex:1;min-width:200px;display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(201,180,142,.25);padding:.65rem 1rem;gap:.6rem}
    .search-box input{background:none;border:none;outline:none;color:var(--white);font-family:var(--font-b);font-size:.9rem;font-weight:300;width:100%}
    .search-box input::placeholder{color:rgba(255,255,255,.3)}
    .filters{display:flex;gap:.4rem;flex-wrap:wrap}
    .filter-btn{font-family:var(--font-b);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .85rem;border:1px solid rgba(201,180,142,.3);background:none;color:var(--mid-gray);cursor:pointer;transition:all .2s;white-space:nowrap}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
    .container{max-width:1100px;margin:0 auto;padding:2rem 1.25rem 4rem}
    .results-count{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mid-gray);margin-bottom:1.25rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .card{background:var(--white);border:1px solid var(--warm-gray);cursor:pointer;transition:all .25s}
    .card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(28,26,23,.12);border-color:var(--accent-light)}
    .card-visual{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
    .card-visual svg{width:90px;height:90px;opacity:.85}
    .card-tag{position:absolute;top:8px;left:8px;font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;padding:.25rem .55rem;background:rgba(138,113,80,.85);color:var(--white)}
    .card-body{padding:1.1rem}
    .card-name{font-family:var(--font-d);font-size:1.2rem;font-weight:400;color:var(--dark);margin-bottom:.25rem}
    .card-muscle{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
    .card-equip{font-size:.72rem;color:var(--mid-gray);margin-bottom:.5rem}
    .card-footer{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.1rem;border-top:1px solid var(--warm-gray)}
    .card-level{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mid-gray)}
    .overlay{position:fixed;inset:0;background:rgba(28,26,23,.88);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
    .overlay.open{display:flex}
    .modal{background:var(--white);width:100%;max-width:660px;max-height:93vh;overflow-y:auto;position:relative;animation:slideUp .3s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-visual{height:200px;display:flex;align-items:center;justify-content:center;position:relative}
    .modal-visual svg{width:120px;height:120px;opacity:.9}
    .modal-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.12);border:none;color:var(--white);width:34px;height:34px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .modal-body{padding:1.5rem 1.5rem 2.5rem}
    .modal-tag{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem}
    .modal-name{font-family:var(--font-d);font-size:1.9rem;font-weight:300;color:var(--dark);line-height:1.15;margin-bottom:.2rem}
    .modal-muscle{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid-gray);margin-bottom:.3rem}
    .modal-equip{font-size:.78rem;color:var(--mid-gray);margin-bottom:1.25rem;font-style:italic}
    .section-label{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.55rem;margin-top:1.3rem;padding-bottom:.3rem;border-bottom:1px solid var(--warm-gray)}
    .steps{list-style:none}
    .steps li{display:flex;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--off-white);font-size:.88rem;color:var(--text);line-height:1.6;align-items:flex-start}
    .steps li:last-child{border-bottom:none}
    .step-num{font-family:var(--font-d);font-size:1rem;color:var(--accent-light);flex-shrink:0;width:18px}
    .cues{display:flex;flex-direction:column;gap:.45rem}
    .cue{background:var(--off-white);padding:.7rem 1rem;font-size:.86rem;color:var(--text);line-height:1.6;border-left:2px solid var(--accent-light)}
    .breath-box{background:var(--dark);padding:1.1rem 1.25rem}
    .breath-box p{font-size:.86rem;color:rgba(255,255,255,.78);line-height:1.7}
    .pf-box{background:var(--off-white);border:1px solid var(--warm-gray);padding:1.1rem 1.25rem}
    .pf-box p{font-size:.86rem;color:var(--text);line-height:1.7}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--mid-gray);grid-column:1/-1}
    .loading-state{text-align:center;padding:3rem 2rem;color:var(--mid-gray)}
    .loading-spinner{display:inline-block;width:32px;height:32px;border:2px solid var(--warm-gray);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ai-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-light);background:rgba(138,113,80,.12);border:1px solid rgba(201,180,142,.3);padding:.25rem .6rem;margin-left:.5rem;vertical-align:middle}
    @media(min-width:640px){.overlay{align-items:center}}
  </style>
</head>
<body>
<header>
  <div class="logo">Lavinia Calumby</div>
  <h1>Exercise <em>Library</em></h1>
  <p>Movement &middot; Technique &middot; Breathing &middot; Core &amp; Pelvic Floor</p>
</header>
<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search exercises, muscles, equipment..." autocomplete="off" />
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Hip Dominant">Hip Dominant</button>
      <button class="filter-btn" data-filter="Knee Dominant">Knee Dominant</button>
      <button class="filter-btn" data-filter="Core Stability">Core Stability</button>
      <button class="filter-btn" data-filter="Core Movement">Core Movement</button>
      <button class="filter-btn" data-filter="Core Mobility">Core Mobility</button>
      <button class="filter-btn" data-filter="Horizontal Push">Horizontal Push</button>
      <button class="filter-btn" data-filter="Horizontal Pull">Horizontal Pull</button>
      <button class="filter-btn" data-filter="Vertical Push">Vertical Push</button>
      <button class="filter-btn" data-filter="Vertical Pull">Vertical Pull</button>
      <button class="filter-btn" data-filter="Single Joint - Upper Body">Single Joint Upper</button>
      <button class="filter-btn" data-filter="Single Joint - Lower Body">Single Joint Lower</button>
      <button class="filter-btn" data-filter="Multi-Pattern Push">Multi Push</button>
      <button class="filter-btn" data-filter="Multi-Pattern Pull">Multi Pull</button>
      <button class="filter-btn" data-filter="Multi-Pattern Combo">Multi Combo</button>
      <button class="filter-btn" data-filter="Multi-Pattern Stability">Multi Stability</button>
      <button class="filter-btn" data-filter="Multi-Pattern Mobility">Multi Mobility</button>
      <button class="filter-btn" data-filter="Upper Body Mobility">Upper Mobility</button>
      <button class="filter-btn" data-filter="Upper Body Stability">Upper Stability</button>
      <button class="filter-btn" data-filter="Lower Body Mobility">Lower Mobility</button>
      <button class="filter-btn" data-filter="Lower Body Stability">Lower Stability</button>
      <button class="filter-btn" data-filter="Triple Extension">Triple Extension</button>
      <button class="filter-btn" data-filter="Locomotion">Locomotion</button>
      <button class="filter-btn" data-filter="Throwing">Throwing</button>
    </div>
  </div>
</div>
<div class="container">
  <div class="results-count" id="resultsCount"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-visual" id="modalVisual">
      <button class="modal-close" id="modalClose">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-tag" id="modalTag"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-muscle" id="modalMuscle"></div>
      <div class="modal-equip" id="modalEquip"></div>
      <div id="modalContent"></div>
    </div>
  </div>
</div>

const aiCache = {};

const SYSTEM_PROMPT = `You are an expert personal trainer and pelvic floor specialist creating entries for an exercise library. For each exercise, generate complete, detailed, professional coaching content in the exact JSON format specified. Your content must be specific to the exact exercise named — never generic.

Always respond with ONLY valid JSON, no markdown, no preamble.

Required JSON format:
{
  "muscle": "Primary muscle(s), Secondary muscles",
  "level": "Beginner / Intermediate / Advanced / Beginner–Intermediate / Intermediate–Advanced",
  "equipment": "Equipment needed (use · to separate multiple items)",
  "steps": ["Step 1 text", "Step 2 text", "Step 3 text", "Step 4 text", "Step 5 text"],
  "cues": ["Cue 1 in CAPS for emphasis where appropriate", "Cue 2", "Cue 3", "Cue 4"],
  "breath": "Specific breathing instruction for this exercise — when to inhale, when to exhale, and why it matters.",
  "pf": "Pelvic floor guidance specific to this exercise — considerations for pelvic floor health, postpartum clients, pressure, and coordination with breath."
}

Guidelines:
- Steps should be 5 clear, numbered instructions describing exactly how to perform the exercise
- Cues should be 4 memorable, specific coaching cues with key words in CAPS
- Breath guidance should be specific to the movement pattern
- Pelvic floor notes must address this specific exercise's impact on the pelvic floor
- For mobility/stretching exercises, adjust appropriately (breathing, relaxation, range of motion)
- For plyometric/power exercises, address the high impact demands on pelvic floor`;

async function generateExerciseDetails(name, category) {
  const key = name.toLowerCase().replace(/\s+/g, '_');
  if (aiCache[key]) return aiCache[key];

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{
        role: 'user',
        content: `Generate complete exercise library details for: "${name}" (Category: ${category})\n\nRespond ONLY with the JSON object.`
      }]
    })
  });

  const data = await response.json();
  const text = data.content.map(i => i.text || '').join('').trim().replace(/^```json\n?|```$/g, '').trim();
  const parsed = JSON.parse(text);
  aiCache[key] = parsed;
  return parsed;
}

  resultsCount.textContent = filtered.length + ' exercise' + (filtered.length !== 1 ? 's' : '');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><p style="font-family:var(--font-d);font-size:1.5rem;color:var(--text);margin-bottom:.5rem">No exercises found</p><p>Try a different search or filter</p></div>';
    return;
  }
  filtered.forEach(ex => {
    const bg = getBg(ex.category);
    const svg = getSvg(ex.category);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-visual" style="background:${bg}">${svg}<div class="card-tag">${ex.category}</div></div>
      <div class="card-body">
        <div class="card-name">${ex.name}</div>
        <div class="card-muscle" style="color:var(--mid-gray);font-size:.65rem;letter-spacing:.08em">Click to load details</div>
      </div>
      <div class="card-footer">
        <span class="card-level" style="color:var(--mid-gray)">${ex.category}</span>
        <span style="font-size:.75rem;color:var(--accent)">View &rarr;</span>
      </div>`;
    card.addEventListener('click', () => openModal(ex));
    grid.appendChild(card);
  });
}

async function openModal(ex) {
  const overlay = document.getElementById('overlay');
  const v = document.getElementById('modalVisual');
  v.style.background = getBg(ex.category);
  const oldSvg = v.querySelector('svg');
  if (oldSvg) oldSvg.remove();
  const tmp = document.createElement('div');
  tmp.innerHTML = getSvg(ex.category);
  const svgEl = tmp.firstElementChild;
  svgEl.style.cssText = 'width:120px;height:120px;opacity:0.9';
  v.insertBefore(svgEl, document.getElementById('modalClose'));

  document.getElementById('modalTag').textContent = ex.category.toUpperCase();
  document.getElementById('modalName').textContent = ex.name;
  document.getElementById('modalMuscle').textContent = '';
  document.getElementById('modalEquip').textContent = '';
  document.getElementById('modalContent').innerHTML = `
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p style="font-size:.8rem;color:var(--mid-gray)">Generating exercise details...</p>
    </div>`;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    let details;
    // Check if pre-built
    const preKey = Object.keys(detailedExercises).find(k => detailedExercises[k].name.toLowerCase() === ex.name.toLowerCase());
    if (preKey) {
      details = detailedExercises[preKey];
    } else {
      details = await generateExerciseDetails(ex.name, ex.category);
    }

    document.getElementById('modalMuscle').textContent = details.muscle || '';
    document.getElementById('modalEquip').textContent = details.equipment ? '✦ ' + details.equipment : '';
    document.getElementById('modalContent').innerHTML = `
      <div class="section-label">HOW TO PERFORM</div>
      <ul class="steps">${(details.steps||[]).map((s,i) => `<li><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('')}</ul>
      <div class="section-label">COACHING CUES</div>
      <div class="cues">${(details.cues||[]).map(c => `<div class="cue">${c}</div>`).join('')}</div>
      <div class="section-label">BREATHING TECHNIQUE</div>
      <div class="breath-box"><p>${details.breath||''}</p></div>
      <div class="section-label">CORE ACTIVATION &amp; PELVIC FLOOR</div>
      <div class="pf-box"><p>${details.pf||''}</p></div>`;
  } catch(err) {
    document.getElementById('modalContent').innerHTML = `<div class="loading-state"><p style="color:var(--mid-gray)">Could not load details. Please try again.</p></div>`;
  }
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

let activeFilter = 'all', searchQuery = '';

function filterExercises() {
  return allExercises.filter(ex => {
    const mf = activeFilter === 'all' || ex.category === activeFilter;
    const q = searchQuery.toLowerCase();
    const ms = !q || ex.name.toLowerCase().includes(q) || ex.category.toLowerCase().includes(q);
    return mf && ms;
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderGrid(filterExercises());
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid(filterExercises());
  });
});

renderGrid(filterExercises());
</script>
</body>
</html>
